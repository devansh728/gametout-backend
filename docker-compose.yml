version: "3.9"

services:
  app:
    image: devu728/gametout-backend:latest
    container_name: gametout-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./secrets/firebase.json:/secrets/firebase.json:ro
    environment:
      JAVA_OPTS: >
        -Xms128m
        -Xmx320m
        -XX:MaxMetaspaceSize=96m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    mem_limit: 320m
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: gametout-redis
    command: >
      redis-server
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
    restart: always
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio
    container_name: gametout-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    restart: always
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  minio-data:

networks:
  app-network:
    driver: bridge
