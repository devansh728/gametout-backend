version: "3.9"

services:
  app:
    image: devu728/gametout-backend:latest
    container_name: gametout-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./secrets/firebase.json:/secrets/firebase.json:ro
    environment:
      JAVA_OPTS: >
        -Xms256m
        -Xmx768m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+ExitOnOutOfMemoryError
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 900m
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: gametout-redis
    restart: always
    command: >
      redis-server
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio
    container_name: gametout-minio
    command: server /data
    restart: always
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  minio-data:

networks:
  app-network:
    driver: bridge


