spring:
  application:
    name: gametout

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: GametoutHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true 

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:yourpassword}
      timeout: 5s
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 3s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      contentService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

  ratelimiter:
    instances:
      contentLimiter:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      searchLimiter:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0

storage:
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:media}
  secure: ${STORAGE_SECURE:false}

# Razorpay Payment Gateway Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}
  # Plan pricing in paise (1 rupee = 100 paise)
  plans:
    viewer:
      amount: 49900   # ₹499
      duration-months: 12
      name: "Elite Viewer"
      description: "View full developer profiles for 1 year"
    creator:
      amount: 149900  # ₹1,499
      duration-months: 12
      name: "Elite Creator"
      description: "Create premium portfolio + viewer benefits for 1 year"

logging:
  level:
    root: INFO
    "[com.gametout]":  INFO
    "[org.springframework.web]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.orm.jdbc.bind]": WARN
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024

#Added for CORS configuration
# Application Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5000}

# OAuth2 Configuration for Discord, LinkedIn, Steam
oauth2:
  discord:
    client-id: ${DISCORD_CLIENT_ID}
    client-secret: ${DISCORD_CLIENT_SECRET}
    redirect-uri: ${API_BASE_URL:http://localhost:8080}/api/oauth2/callback/discord
    scope: identify email
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    redirect-uri: ${API_BASE_URL:http://localhost:8080}/api/oauth2/callback/linkedin
    scope: openid profile email
  steam:
    api-key: ${STEAM_API_KEY:}
    redirect-uri: ${API_BASE_URL:http://localhost:8080}/api/oauth2/callback/steam
    realm: ${API_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:gametout-oauth2-jwt-secret-key-must-be-at-least-256-bits-long-for-security}
    expiration: 86400000  # 24 hours in milliseconds
    issuer: gametout

